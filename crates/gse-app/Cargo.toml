[package]
name = "gse-app"
description = "GSE ground station: serial link, safety supervisor, local web GUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "gse-app"
path = "src/main.rs"

[dependencies]
gse-proto = { workspace = true }
# The ESP-NOW pad link runs the GSE vehicle state machine app-side as the
# supervisor for the app-only extras (fill timer, interlocks, latches).
gse-fw-core = { workspace = true }
serialport = { version = "4.6", default-features = false }

[dev-dependencies]
gse-fw-core = { workspace = true, features = ["mock"] }

[features]
default = []
pingpong-regression = []
