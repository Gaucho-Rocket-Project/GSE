[package]
name = "gse-app"
description = "GSE ground station: serial link, safety supervisor, local web GUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "gse-app"
path = "src/main.rs"

[dependencies]
gse-proto = { workspace = true }
serialport = { version = "4.6", default-features = false }

[features]
default = []
pingpong-regression = []
