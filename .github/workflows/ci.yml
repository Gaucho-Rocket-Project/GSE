name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  formatting:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: >-
          rustfmt --edition 2021 --check
          firmware/stm32h753/src/lib.rs
          firmware/stm32h753/src/hw.rs
          firmware/stm32h753/src/bin/ground.rs
          firmware/stm32h753/src/bin/vehicle.rs
          firmware/stm32h753/src/bin/gse-test.rs
          firmware/stm32h753/build.rs

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p gse-fw-check --all-targets --no-default-features --features radio-e28-2g4m27s -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The workspace has no doctests; every example lives in a real test.
      - run: cargo test --workspace --lib --bins --tests
      - name: Test the opt-in pingpong host responder
        run: cargo test -p gse-app --features pingpong-regression

  smoke:
    name: end-to-end smoke test
    runs-on: ubuntu-latest
    needs: [clippy]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: ./scripts/smoke.sh

  firmware:
    name: firmware (thumbv7em)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/stm32h753
      - name: Install cargo-binutils
        run: cargo install cargo-binutils --locked
      # Run from inside the package so `firmware/stm32h753/.cargo/config.toml`
      # supplies the Cortex-M target triple and the `-Tlink.x` link argument.
      - name: Build ground and vehicle firmware (DX-LR42 default)
        working-directory: firmware/stm32h753
        run: cargo build --release --bins
      - name: Build ground and vehicle firmware (E28-2G4M27S default)
        working-directory: firmware/stm32h753
        run: cargo build --release --bins --no-default-features --features radio-e28-2g4m27s
      - name: Build ground pingpong regression image
        working-directory: firmware/stm32h753
        run: cargo build --release --bin gse-ground --no-default-features --features pingpong-regression
      - name: Build and package standalone GSE-test firmware
        working-directory: firmware/stm32h753
        run: |
          cargo build --release --bin gse-test
          mkdir -p ../../artifacts
          cargo objcopy --release --bin gse-test -- -O binary ../../artifacts/GSE-test.bin
      - uses: actions/upload-artifact@v4
        with:
          name: GSE-test-firmware
          path: artifacts/GSE-test.bin
          if-no-files-found: error
