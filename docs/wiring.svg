<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .box     { fill:#ffffff; stroke:#2b3a55; stroke-width:2.5; rx:10; }
      .board   { fill:#f2f7fc; stroke:#2b3a55; stroke-width:3; rx:12; }
      .supply  { fill:#fff7f7; stroke:#b03a3a; stroke-width:2.5; rx:10; }
      .title   { font-size:27px; font-weight:bold; fill:#15202b; }
      .sub     { font-size:15px; fill:#55677a; }
      .servo   { font-size:16px; font-weight:bold; fill:#15202b; }
      .pinname { font-size:14px; fill:#33475b; }
      .boardpin{ font-size:15px; font-weight:bold; fill:#15202b; }
      .hint    { font-size:12px; fill:#6b7c8d; }
      .rail    { font-size:15px; font-weight:bold; }
      .sig     { stroke:#e08a00; stroke-width:4; fill:none; stroke-linecap:round; }
      .pwr     { stroke:#d33a3a; stroke-width:4; fill:none; stroke-linecap:round; }
      .gnd     { stroke:#4a4a4a; stroke-width:4; fill:none; stroke-linecap:round; }
      .dash    { stroke:#d33a3a; stroke-width:3; fill:none; stroke-dasharray:8 6; }
    </style>
  </defs>

  <rect width="1100" height="800" fill="#ffffff"/>
  <text x="550" y="42" text-anchor="middle" class="title">ESP32-S3 + two SG90 servos — how to wire it</text>
  <text x="550" y="66" text-anchor="middle" class="sub">Signal: orange · Power: red (5 V) · Ground: brown — all grounds joined together</text>

  <!-- ======= SERVO 1 ======= -->
  <rect x="50" y="110" width="240" height="160" class="box"/>
  <text x="170" y="137" text-anchor="middle" class="servo">SG90 servo #1</text>
  <text x="278" y="175" text-anchor="end" class="pinname">ORANGE</text>
  <text x="278" y="212" text-anchor="end" class="pinname">RED</text>
  <text x="278" y="249" text-anchor="end" class="pinname">BROWN</text>
  <circle cx="290" cy="170" r="8" fill="#e08a00" stroke="#8a5300" stroke-width="1.5"/>
  <circle cx="290" cy="207" r="8" fill="#d33a3a" stroke="#8a1a1a" stroke-width="1.5"/>
  <circle cx="290" cy="244" r="8" fill="#6b4a2f" stroke="#3d2a19" stroke-width="1.5"/>

  <!-- ======= SERVO 2 ======= -->
  <rect x="50" y="315" width="240" height="160" class="box"/>
  <text x="170" y="342" text-anchor="middle" class="servo">SG90 servo #2</text>
  <text x="278" y="380" text-anchor="end" class="pinname">ORANGE</text>
  <text x="278" y="417" text-anchor="end" class="pinname">RED</text>
  <text x="278" y="454" text-anchor="end" class="pinname">BROWN</text>
  <circle cx="290" cy="375" r="8" fill="#e08a00" stroke="#8a5300" stroke-width="1.5"/>
  <circle cx="290" cy="412" r="8" fill="#d33a3a" stroke="#8a1a1a" stroke-width="1.5"/>
  <circle cx="290" cy="449" r="8" fill="#6b4a2f" stroke="#3d2a19" stroke-width="1.5"/>

  <!-- ======= ESP32-S3 BOARD ======= -->
  <rect x="670" y="90" width="330" height="430" class="board"/>
  <text x="835" y="120" text-anchor="middle" class="servo">ESP32-S3 dev board</text>

  <circle cx="670" cy="145" r="8" fill="#e8eef7" stroke="#2b3a55" stroke-width="2"/>
  <text x="688" y="150" class="boardpin">GPIO4</text>
  <text x="752" y="150" class="hint" style="font-size:13px">servo 1 signal</text>

  <circle cx="670" cy="200" r="8" fill="#e8eef7" stroke="#2b3a55" stroke-width="2"/>
  <text x="688" y="205" class="boardpin">GPIO5</text>
  <text x="752" y="205" class="hint" style="font-size:13px">servo 2 signal</text>

  <circle cx="670" cy="330" r="8" fill="#e8eef7" stroke="#2b3a55" stroke-width="2"/>
  <text x="688" y="335" class="boardpin">5V</text>
  <text x="730" y="335" class="hint" style="font-size:13px">from USB / VIN</text>

  <circle cx="670" cy="385" r="8" fill="#e8eef7" stroke="#2b3a55" stroke-width="2"/>
  <text x="688" y="390" class="boardpin">GND</text>
  <text x="738" y="390" class="hint" style="font-size:13px">common ground</text>

  <rect x="720" y="425" width="230" height="38" rx="7" fill="#e8eef7" stroke="#2b3a55" stroke-width="1.5"/>
  <text x="835" y="449" text-anchor="middle" class="hint" style="font-size:13px">USB-C → PC = serial console</text>
  <text x="835" y="490" text-anchor="middle" class="hint" style="font-size:12.5px">never power servos from 3V3</text>

  <!-- ======= SIGNAL WIRES ======= -->
  <path class="sig" d="M290,170 L620,170 L620,145 L670,145"/>
  <path class="sig" d="M290,375 L600,375 L600,200 L670,200"/>

  <!-- ======= 5 V TRUNK (x = 500) ======= -->
  <path class="pwr" d="M290,207 L500,207 L500,565"/>
  <path class="pwr" d="M290,412 L500,412"/>
  <circle cx="500" cy="412" r="6" fill="#d33a3a"/>
  <circle cx="500" cy="565" r="6" fill="#d33a3a"/>

  <!-- ======= GND TRUNK (x = 460) ======= -->
  <path class="gnd" d="M290,244 L460,244 L460,625"/>
  <path class="gnd" d="M290,449 L460,449"/>
  <circle cx="460" cy="449" r="6" fill="#4a4a4a"/>
  <circle cx="460" cy="625" r="6" fill="#4a4a4a"/>

  <!-- ======= HOP-OVERS (wire crossings, no connection) ======= -->
  <rect x="450" y="366" width="20" height="18" fill="#ffffff"/>
  <path d="M451,375 A 9,9 0 0 1 469,375" stroke="#e08a00" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="490" y="366" width="20" height="18" fill="#ffffff"/>
  <path d="M491,375 A 9,9 0 0 1 509,375" stroke="#e08a00" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="450" y="403" width="20" height="18" fill="#ffffff"/>
  <path d="M451,412 A 9,9 0 0 1 469,412" stroke="#d33a3a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="643" y="556" width="18" height="20" fill="#ffffff"/>
  <path d="M652,556 A 9,9 0 0 1 652,574" stroke="#4a4a4a" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- ======= ESP32 5V → rail (optional, dashed) ======= -->
  <path class="dash" d="M670,330 L610,330 L610,565"/>
  <circle cx="610" cy="565" r="5" fill="#d33a3a"/>
  <text x="620" y="352" class="hint" style="font-size:11.5px; fill:#a06060">optional</text>

  <!-- ======= ESP32 GND → rail (always) ======= -->
  <path class="gnd" d="M670,385 L652,385 L652,557"/>
  <path class="gnd" d="M652,573 L652,660 L840,660 L840,625"/>
  <circle cx="840" cy="625" r="6" fill="#4a4a4a"/>

  <!-- ======= RAILS ======= -->
  <path class="pwr" d="M310,565 L840,565"/>
  <path class="gnd" d="M310,625 L840,625"/>
  <text x="850" y="561" class="rail" fill="#d33a3a">5 V rail</text>
  <text x="850" y="580" class="hint">servo + · supply +</text>
  <text x="850" y="621" class="rail" fill="#4a4a4a">GND rail</text>
  <text x="850" y="640" class="hint">servo − · supply −</text>

  <!-- ======= 5 V SUPPLY ======= -->
  <rect x="50" y="510" width="230" height="150" class="supply"/>
  <text x="165" y="537" text-anchor="middle" class="servo" fill="#8a1a1a">5 V supply</text>
  <text x="165" y="561" text-anchor="middle" class="hint" style="font-size:13px">two SG90s ⇒ ≥ 1 A</text>
  <text x="165" y="581" text-anchor="middle" class="hint" style="font-size:13px">(recommended)</text>
  <text x="165" y="612" text-anchor="middle" class="hint" style="font-size:12px">5 V adapter or</text>
  <text x="165" y="630" text-anchor="middle" class="hint" style="font-size:12px">USB charger</text>
  <circle cx="280" cy="565" r="7" fill="#d33a3a"/>
  <circle cx="280" cy="625" r="7" fill="#4a4a4a"/>
  <text x="264" y="570" text-anchor="end" class="hint" style="font-size:14px; fill:#d33a3a">+</text>
  <text x="264" y="630" text-anchor="end" class="hint" style="font-size:14px; fill:#4a4a4a">−</text>
  <path class="pwr" d="M280,565 L310,565"/>
  <path class="gnd" d="M280,625 L310,625"/>

  <!-- ======= NOTES ======= -->
  <rect x="330" y="680" width="720" height="100" rx="9" fill="#f7f9fc" stroke="#c3cfdd" stroke-width="1.5"/>
  <text x="350" y="704" class="hint" style="font-size:13.5px; fill:#33475b">• All grounds are common: both servo browns + supply − + ESP32 GND.</text>
  <text x="350" y="727" class="hint" style="font-size:13.5px; fill:#33475b">• Dashed red wire: only if the servos are powered from the board's 5V pin.</text>
  <text x="350" y="750" class="hint" style="font-size:13.5px; fill:#33475b">• Fit a 470–1000 µF electrolytic across 5 V and GND: stops resets when motors start.</text>
  <text x="350" y="771" class="hint" style="font-size:13.5px; fill:#33475b">• Never feed 5 V into GPIO4/GPIO5 · never power a servo from 3V3.</text>

  <!-- ======= LEGEND ======= -->
  <path class="sig" d="M56,706 L96,706"/><text x="104" y="711" class="hint" style="font-size:13px">PWM signal 50 Hz</text>
  <path class="pwr" d="M56,736 L96,736"/><text x="104" y="741" class="hint" style="font-size:13px">+5 V</text>
  <path class="gnd" d="M56,766 L96,766"/><text x="104" y="771" class="hint" style="font-size:13px">ground</text>
</svg>
