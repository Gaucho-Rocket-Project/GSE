; PlatformIO project for the Mojave Sphinx GSE radio link
;
;   pio run -e pad-node            launch-pad controller  (ESP32-S3, default)
;   pio run -e tx-node             laptop bridge, ESP32-S3 variant
;   pio run -e tx-nucleo           laptop bridge, STM32H753ZI (Nucleo-144)
;
;   pio run -e pad-node-esp32s     launch-pad controller, ESP-32S variant
;   pio run -e tx-node-esp32s      laptop bridge,        ESP-32S variant
;
;   pio run -e pad-node   -t upload
;   pio device monitor -e tx-nucleo
;
; Hardware notes
;   pad-node        ESP32-S3 devkit (DevKitC-1 / N16R8) + DX-LR41-24T12S
;   tx-node         ESP32-S3 devkit + DX-LR41-24T12S
;   pad-node-esp32s "ESP-32S Development Board 2.4 GHz Dual-Mode WiFi+Bluetooth"
;                   (ESP32-WROOM-32, 30/38-pin) + DX-LR41-24T12S
;   tx-node-esp32s  the same board, as the laptop bridge
;   tx-nucleo       NUCLEO-H753ZI (MB1364E) + DX-LR41-24T12S on USART2 (PD5/PD6),
;                   laptop on the ST-LINK VCP (USART3, PD8/PD9)
;
; The ESP32-S3 and ESP-32S variants run the same source; only the board
; definition and the pin map in src/config.h differ.  A pad node on either
; board talks to a TX node on either board -- the air protocol and the
; failsafes are identical.
;
; ESP32-S3 devkits have TWO USB-C sockets. Upload through the one labelled
; "UART" (a CP210x/CH340 bridge, /dev/ttyUSB*, COM5-style). The socket labelled
; "USB" is the chip's native peripheral; flashing over it gives
; "Failed to connect to ESP32-S3: No serial data received".
; The ESP-32S has a single micro-USB socket wired to a CP2102/CH340 bridge, so
; it behaves like the S3's "UART" socket all the time.
; See docs/TROUBLESHOOTING_UPLOAD.md.
;
[platformio]
default_envs = pad-node

; ---------------------------------------------------------------- ESP32-S3 --
[esp32_base]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_ldf_mode = off
lib_deps =
; 115200 is slow but survives cheap cables and clones. Raise to 460800 once
; your board + cable are proven (see docs/TROUBLESHOOTING_UPLOAD.md step 2).
upload_speed = 115200
build_flags =
    -Wall -Wextra -I src -I src/common
    -D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MODE=1 -D CORE_DEBUG_LEVEL=0
    ; explicit, although an S3 build is also what you get with no flag at all
    -D GSE_BOARD_ESP32_S3
    ; Name in the TX console banner and INFO line, e.g.
    ;   LOG TX esp32s3 fw 1.0 ready
    ; Quoted for a POSIX shell (CI, macOS, Linux).  On Windows PowerShell swap
    ; the outer single quotes for double quotes: -D "GSE_PLATFORM_NAME=\"esp32s3\"
    -D 'GSE_PLATFORM_NAME="esp32s3"'

[env:pad-node]
extends = esp32_base
build_src_filter = +<common/> +<pad/>
build_flags = ${esp32_base.build_flags} -I src/pad -D GSE_ROLE_PAD

[env:tx-node]
extends = esp32_base
build_src_filter = +<common/> +<tx/>
build_flags = ${esp32_base.build_flags} -I src/tx -D GSE_ROLE_TX
build_unflags = -I src/pad -D GSE_ROLE_PAD

; --------------------------------------------------------------- ESP-32S ----
; "ESP-32S Development Board 2.4GHz Dual-Mode WiFi+Bluetooth", i.e. the
; classic 30-pin ESP32-WROOM-32 devkit with a CP2102/CH340 bridge.  4 MB flash
; is assumed (the common board); the firmware needs ~350 KB.
;
; Differences that the build handles for you (src/config.h):
;   * no native USB: the laptop sees the bridge chip on UART0, so ARDUINO_USB_*
;     flags are dropped and Serial is UART0 at 115200;
;   * no WS2812: the status LED is the on-board blue LED on GPIO2 instead;
;   * GPIO6..11 are the SPI flash: PURGE / IGNITER / heartbeat move to
;     D15 / D13 / D33 (D13, not D14: D14 emits a PWM burst at boot).
;
; The board definition `esp32dev` covers the 30-pin 4 MB WROOM-32 devkit. On a
; 38-pin board or a 16 MB clone, add `board_upload.flash_size` / a matching
; `board = ...` here -- nothing in src/ changes.
[esp32s_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = off
lib_deps =
upload_speed = 115200
build_flags =
    -Wall -Wextra -I src -I src/common
    -D CORE_DEBUG_LEVEL=0
    -D GSE_BOARD_ESP32S
    -D 'GSE_PLATFORM_NAME="esp32s"'

[env:pad-node-esp32s]
extends = esp32s_base
build_src_filter = +<common/> +<pad/>
build_flags = ${esp32s_base.build_flags} -I src/pad -D GSE_ROLE_PAD

[env:tx-node-esp32s]
extends = esp32s_base
build_src_filter = +<common/> +<tx/>
build_flags = ${esp32s_base.build_flags} -I src/tx -D GSE_ROLE_TX
build_unflags = -I src/pad -D GSE_ROLE_PAD

; ------------------------------------------- Bluetooth transport (optional) --
; The same two nodes with the DX-LR42/LR41 modules REMOVED and the ESP32's own
; Bluetooth Low Energy radio carrying the identical 7E frames.  Nothing to
; wire, nothing to provision: flash both boards, power them, done.
;
;   pio run -e pad-node-ble          -t upload
;   pio run -e tx-node-ble           -t upload
;   pio run -e pad-node-ble-esp32s   -t upload
;   pio run -e tx-node-ble-esp32s    -t upload
;
; Both ends must use a -ble env.  A BLE pad cannot hear a LoRa TX node.
;
; Range: BLE at the default power is a ~10-50 m line-of-sight link, which is
; fine on a bench and not a substitute for the LoRa pair in the field.  No
; pairing/encryption is used -- the arm code and the physical arm key remain
; the interlocks.  Read docs/LINK_OPTIONS.md before picking this for anything
; other than bench work, and docs/TEST_PLAN.md T-11 for what to verify.
;
; The BLE library ("BLE") ships inside the ESP32 Arduino core, so there is no
; lib_deps entry to add.  It does need PlatformIO's dependency finder, though:
; the base envs set lib_ldf_mode = off and that would leave <BLEDevice.h>
; unresolved.  Each -ble env therefore switches lib_ldf_mode to "chain", which
; is the default for the framework and costs only a little build-time.
[ble_base]
build_flags =
    -D GSE_LINK_BLE

[env:pad-node-ble]
extends = esp32_base
build_src_filter = +<common/> +<pad/>
build_flags = ${esp32_base.build_flags} ${ble_base.build_flags} -I src/pad -D GSE_ROLE_PAD
lib_ldf_mode = chain

[env:tx-node-ble]
extends = esp32_base
build_src_filter = +<common/> +<tx/>
build_flags = ${esp32_base.build_flags} ${ble_base.build_flags} -I src/tx -D GSE_ROLE_TX
build_unflags = -I src/pad -D GSE_ROLE_PAD
lib_ldf_mode = chain

[env:pad-node-ble-esp32s]
extends = esp32s_base
build_src_filter = +<common/> +<pad/>
build_flags = ${esp32s_base.build_flags} ${ble_base.build_flags} -I src/pad -D GSE_ROLE_PAD
lib_ldf_mode = chain

[env:tx-node-ble-esp32s]
extends = esp32s_base
build_src_filter = +<common/> +<tx/>
build_flags = ${esp32s_base.build_flags} ${ble_base.build_flags} -I src/tx -D GSE_ROLE_TX
build_unflags = -I src/pad -D GSE_ROLE_PAD
lib_ldf_mode = chain

; ---------------------------------------------------------------- STM32H753 --
; The Nucleo build uses the Arduino framework for STM32 because it needs no
; CubeMX project file to demonstrate the link; for a CubeIDE/HAL integration use
; stm32/tx_platform_stm32.c + src/common/gse_tx_core.c instead (see stm32/README.md).
[env:tx-nucleo]
platform = ststm32
board = nucleo_h753zi
framework = arduino
monitor_speed = 115200
build_src_filter = +<common/> +<stm32/>
build_flags =
    -Wall -Wextra -I src -I src/common -I src/stm32
    -D GSE_ROLE_TX -D GSE_PLATFORM_STM32
    -D 'GSE_PLATFORM_NAME="stm32"'
    ; stm32duino only instantiates the console UART (USART3) unless asked for
    ; more, so name the two extra ports explicitly:
    -D ENABLE_HWSERIAL1 -D ENABLE_HWSERIAL2
